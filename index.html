<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodSoft Web Development Projects</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 { margin-bottom: 8px; text-align: center; }
    p { color: #94a3b8; margin-bottom: 24px; text-align: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 8px;
      text-decoration: none;
      color: #38bdf8;
      font-weight: bold;
      text-align: center;
      border: 1px solid #334155;
      transition: transform 0.2s, background 0.2s;
    }
    .card:hover {
      background: #334155;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <h1>CodSoft Internship Projects</h1>
  <p>Select a project below to view the live deployment:</p>
  <div class="grid">
    <a class="card" href="https://sajalsaha151202.github.io/codsoft_tasks/portfolio/">Task 1: Portfolio Website</a>
    <a class="card" href="https://sajalsaha151202.github.io/codsoft_tasks/music-player/">Task 2: Music Player</a>
    <a class="card" href="https://sajalsaha151202.github.io/codsoft_tasks/Expense-Tracker/">Task 3: Expense Tracker</a>
    <a class="card" href="https://sajalsaha151202.github.io/codsoft_tasks/Task-List-Application/">Task 4: Task Manager</a>
  </div>
</body>
</html>
